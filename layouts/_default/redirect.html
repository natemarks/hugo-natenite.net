{{ define "header_css" }}
<meta http-equiv="refresh" content="0; url={{ .Params.redirect_url }}">
<script>window.location.replace({{ .Params.redirect_url | jsonify | safeJS }});</script>
{{ end }}

{{ define "main" }}
<div class="container pb-6 pt-6 pt-md-14 pb-md-14">
  <div class="row justify-content-start">
    <div class="col-12">
      <h1 class="title">{{ .Title }}</h1>
      <p>Redirecting you to <a href="{{ .Params.redirect_url }}">{{ .Params.redirect_url }}</a>&hellip;</p>
    </div>
  </div>
</div>
{{ end }}
